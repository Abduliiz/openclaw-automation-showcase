<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <style>
      .title{font:700 34px Inter,Arial; fill:#f8fafc}
      .node{fill:#1e293b; stroke:#475569; stroke-width:2; rx:12}
      .txt{font:600 16px Inter,Arial; fill:#e2e8f0}
      .sub{font:500 13px Inter,Arial; fill:#a5b4fc}
      .line{stroke:#22d3ee; stroke-width:3; marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg2)"/>
  <text x="60" y="70" class="title">Automation Workflow Map</text>

  <rect x="80" y="140" width="230" height="90" class="node"/>
  <text x="100" y="175" class="txt">Daily Trigger</text>
  <text x="100" y="198" class="sub">Cron / Heartbeat</text>

  <rect x="370" y="140" width="260" height="90" class="node"/>
  <text x="390" y="175" class="txt">Data Pull</text>
  <text x="390" y="198" class="sub">Jobs, inbox, calendar, news</text>

  <rect x="690" y="140" width="260" height="90" class="node"/>
  <text x="710" y="175" class="txt">Ranking + Drafting</text>
  <text x="710" y="198" class="sub">Fit scoring + response drafts</text>

  <rect x="980" y="140" width="150" height="90" class="node"/>
  <text x="1000" y="175" class="txt">Delivery</text>
  <text x="1000" y="198" class="sub">Email/DM</text>

  <rect x="370" y="330" width="260" height="110" class="node"/>
  <text x="390" y="370" class="txt">Approval Gate</text>
  <text x="390" y="395" class="sub">Explicit yes required</text>
  <text x="390" y="418" class="sub">for send/post/apply</text>

  <rect x="690" y="330" width="260" height="110" class="node"/>
  <text x="710" y="370" class="txt">Action Execution</text>
  <text x="710" y="395" class="sub">Apply / Post / Send</text>
  <text x="710" y="418" class="sub">with logging</text>

  <line x1="310" y1="185" x2="370" y2="185" class="line"/>
  <line x1="630" y1="185" x2="690" y2="185" class="line"/>
  <line x1="950" y1="185" x2="980" y2="185" class="line"/>
  <line x1="820" y1="230" x2="820" y2="330" class="line"/>
  <line x1="630" y1="385" x2="690" y2="385" class="line"/>

  <text x="60" y="620" class="sub">Built for practical operations: speed from automation, reliability from approval controls.</text>
</svg>