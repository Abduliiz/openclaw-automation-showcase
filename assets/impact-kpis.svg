  <text x="826" y="288" class="s">Centralized tracking for 214+ projects</text>

  <rect x="60" y="400" width="340" height="220" class="card"/>
  <text x="86" y="480" class="k">99%</text>
  <text x="86" y="512" class="l">Manual review time reduced</text>
  <text x="86" y="538" class="s">AI validation flow for 50,000+ poles</text>

  <rect x="430" y="400" width="340" height="220" class="card"/>
  <text x="456" y="480" class="k">2,000+</text>
  <text x="456" y="512" class="l">Mobile app users</text>
  <text x="456" y="538" class="s">Cross-platform app built end-to-end</text>

  <rect x="800" y="400" width="340" height="220" class="card"/>
  <text x="826" y="480" class="k">80%</text>
  <text x="826" y="512" class="l">API call reduction</text>
  <text x="826" y="538" class="s">Local cache strategy for prayer data</text>
