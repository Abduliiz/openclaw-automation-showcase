<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:700 38px Inter,Arial; fill:#f8fafc}
      .sub{font:500 16px Inter,Arial; fill:#a5b4fc}
      .step{fill:#1e293b; stroke:#334155; stroke-width:2; rx:14}
      .h{font:700 18px Inter,Arial; fill:#e2e8f0}
      .p{font:500 14px Inter,Arial; fill:#94a3b8}
      .arrow{stroke:#22d3ee; stroke-width:4; marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="60" y="78" class="title">Daily Internship Sourcing Funnel</text>
  <text x="60" y="106" class="sub">Vancouver BC + Seattle WA | Winter/Fall 2026 priority</text>

  <rect x="80" y="170" width="190" height="140" class="step"/>
  <text x="102" y="215" class="h">1. Source</text>
  <text x="102" y="240" class="p">LinkedIn + company
careers + recent listings</text>

  <rect x="320" y="170" width="190" height="140" class="step"/>
  <text x="342" y="215" class="h">2. Filter</text>
  <text x="342" y="240" class="p">Location + term +
role relevance</text>

  <rect x="560" y="170" width="190" height="140" class="step"/>
  <text x="582" y="215" class="h">3. Rank</text>
  <text x="582" y="240" class="p">Fit score + urgency +
application path</text>

  <rect x="800" y="170" width="190" height="140" class="step"/>
  <text x="822" y="215" class="h">4. Prepare</text>
  <text x="822" y="240" class="p">Tailored snippets +
application notes</text>

  <rect x="1040" y="170" width="130" height="140" class="step"/>
  <text x="1058" y="215" class="h">5. Send</text>
  <text x="1058" y="240" class="p">Email digest
(~10 roles/day)</text>

  <line x1="270" y1="240" x2="320" y2="240" class="arrow"/>
  <line x1="510" y1="240" x2="560" y2="240" class="arrow"/>
  <line x1="750" y1="240" x2="800" y2="240" class="arrow"/>
  <line x1="990" y1="240" x2="1040" y2="240" class="arrow"/>

  <rect x="150" y="390" width="900" height="210" class="step"/>
  <text x="180" y="435" class="h">Output format per role</text>
  <text x="180" y="465" class="p">• Job Title • Company • City • Term (Winter/Fall 2026) • Apply URL • LinkedIn vs External Apply • 1-line fit note</text>
  <text x="180" y="495" class="p">• Duplicate suppression • stale post checks • daily consistency</text>
  <text x="180" y="545" class="p">Result: fast, actionable application pipeline with minimal manual overhead.</text>
</svg>